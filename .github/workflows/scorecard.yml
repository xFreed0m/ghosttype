name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '24 6 * * 1'
  push:
    branches: [main]

# Read-only by default; the analysis job elevates only what it needs.
# defends: token-scope abuse via a compromised action
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed for the OIDC token Scorecard uses to read branch protection.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          # OpenSSF Scorecard probes deps.dev / OSV / OSS-Fuzz / BestPractices
          # and uploads SARIF. Allowlist derived from a real audit run.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.deps.dev:443
            api.osv.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            www.bestpractices.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # defends: credential persistence in .git/config reused by later steps
          persist-credentials: false

      - name: Run analysis
        # pin verified vs v2.4.0 release
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # MUST stay false on a fork: the OpenSSF webapp rejects fork
          # publishing (HTTP 400, "Fork repository: true") and the action
          # then exits non-zero, failing this workflow. The score badge is
          # therefore structurally unavailable while this repo is a fork —
          # only achievable if it becomes a non-fork/standalone repo.
          publish_results: false

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
